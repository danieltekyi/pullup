name: Deploy to Cloudflare (Pages + Worker)

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'wrangler.*.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # QUALITY GATE (DEF-009): deployment previously ran straight off a push to
  # main with no dependency on CI, so a red build shipped to production. Every
  # deploy job now waits on this.
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run shared:build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  api:
    name: Deploy API Worker
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run shared:build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # Pinned explicitly. The action falls back to installing its own
          # (older) wrangler when the local one is unusable, and wrangler < 4.36
          # silently drops the [[ratelimits]] block — which shipped an API with
          # no rate limiting at all. Node 22+ is required for wrangler 4.
          wranglerVersion: '4.36.0'
          command: deploy

  pages:
    name: Deploy ${{ matrix.mode }} to Pages
    runs-on: ubuntu-latest
    needs: [ci, api]
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: admin
            project: pullup-admin
          - mode: rider
            project: pullup-rider
          - mode: customer
            project: pullup-customer
          # DEF-015: the partner portal was live but built outside the pipeline,
          # so production ran from an unknown commit with no rollback path.
          - mode: partner
            project: pullup-partner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run shared:build

      - name: Build ${{ matrix.mode }}
        working-directory: apps/frontend
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
          VITE_API_URL: ""
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npx vite build

      - name: Deploy to Cloudflare Pages (${{ matrix.project }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist-${{ matrix.mode }} --project-name=${{ matrix.project }} --branch=main
