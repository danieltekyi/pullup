name = "pullup-api"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Bindings and routing
# --------------------------------------------------------------------
# The Worker serves the API at api.aegisassetllc.com (direct access) AND
# under /api/* on each frontend subdomain — same-origin so Cloudflare Access
# cookies flow naturally. Pages serves everything else on the frontend subdomains.

[[routes]]
pattern = "api.aegisassetllc.com"
custom_domain = true

# Admin console. Moved off the bare brand subdomain (which now serves the public
# marketing site) so the customer-facing name is not an internal tool.
[[routes]]
pattern = "pullupadmin.aegisassetllc.com/api/*"
zone_name = "aegisassetllc.com"

[[routes]]
pattern = "pulluprider.aegisassetllc.com/api/*"
zone_name = "aegisassetllc.com"

[[routes]]
pattern = "pullupcustomer.aegisassetllc.com/api/*"
zone_name = "aegisassetllc.com"

# Client portal (Pages project pullup-web, behind the "PullUp Client Portal"
# Access application). Serving /api/* from the same host means portal requests
# are same-origin, so the CF_Authorization cookie Access sets is actually sent —
# a cross-origin call to api.aegisassetllc.com would never carry it.
[[routes]]
pattern = "pullupportal.aegisassetllc.com/api/*"
zone_name = "aegisassetllc.com"

# --------------------------------------------------------------------
# Bindings (fill IDs after `wrangler d1 create` / `wrangler r2 bucket create`)
# --------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "pullup"
database_id = "f885914c-8932-4b17-9ddc-58a2f8f85fac"
migrations_dir = "src/db/migrations"

# R2 bucket for proof-of-delivery images (signatures, photos).
[[r2_buckets]]
binding = "PROOF_BUCKET"
bucket_name = "pullup-proof"

[[kv_namespaces]]
binding = "KV"
id = "dc4829795aff4c8fb8bdc7413b78e1c1"

# --------------------------------------------------------------------
# Rate limiting (DEF-002)
# --------------------------------------------------------------------
# Uses Cloudflare's native rate limiting rather than a KV counter. KV reads are
# edge-cached for up to 60 seconds, so a KV-based counter cannot observe its own
# recent writes and silently fails to throttle a burst — which is exactly the
# traffic pattern that matters here. These bindings are strongly consistent
# within a colo. `period` must be 10 or 60.

[[ratelimits]]
name = "RL_PUBLIC"          # tracker validate / proxy — anti-enumeration
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_ESTIMATE"        # calls the paid Google Distance Matrix API
namespace_id = "1002"

  [ratelimits.simple]
  limit = 15
  period = 60

[[ratelimits]]
name = "RL_ORDER_CREATE"    # unauthenticated public order creation
namespace_id = "1003"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_AUTH_REQUEST"    # OTP send — limits SMS/email spend and spam
namespace_id = "1004"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_AUTH_VERIFY"     # OTP verify — the brute-force surface
namespace_id = "1005"

  [ratelimits.simple]
  limit = 10
  period = 60

# Poll active partner endpoints every 5 minutes (see scheduledPartnerFetch)
[triggers]
crons = ["*/5 * * * *"]

# --------------------------------------------------------------------
# Variables (safe to commit)
# --------------------------------------------------------------------

[vars]
FRONTEND_ADMIN_URL    = "https://pullup.aegisassetllc.com"
FRONTEND_RIDER_URL    = "https://pulluprider.aegisassetllc.com"
FRONTEND_CUSTOMER_URL = "https://pullupcustomer.aegisassetllc.com"
# Origins permitted to call the API from a browser. The marketing site and its
# client portal (pullup-web) live on their own origin and authenticate with a
# partner Bearer token, so they must be listed here explicitly.
# Origins permitted to call the API from a browser. pullup.aegisassetllc.com is
# the public marketing site and deliberately absent — it has no authenticated
# API calls, and its own /api/lead is served by Pages Functions, not this Worker.
ALLOWED_ORIGINS       = "https://pullupadmin.aegisassetllc.com,https://pulluprider.aegisassetllc.com,https://pullupcustomer.aegisassetllc.com,https://pulluppartner.aegisassetllc.com,https://pullupportal.aegisassetllc.com"
CF_ACCESS_TEAM_DOMAIN = "aegis-dashboard.cloudflareaccess.com"
# One AUD per Access application — a token may carry any of them.
# admin, rider, api, client portal
CF_ACCESS_AUD         = "224159b5912326257bc0ee012f7727193e3708631f3e70632fc406c646b90111,b58f3ac228de8f6b297ff74c51a442d6402c8163ef9afebc45f08abf77fa1a81,edaa3f63b88305167a606332d1d01a99266748b6d544e02db344d04e5cbadd40,154ad300de820eeaa6dcf384dd651718512d092374b4223521e0da4f83d91507"
CF_ACCOUNT_ID         = "e1ae61e9ae55a87ae70b9920e8c54aa5"
